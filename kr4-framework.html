<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KR4 · 后编辑宇宙</title>
<style>
  :root{
    --bg:#05060d; --text:#e8ecf8; --muted:#8b93b8;
    --c1:#6366f1; --c2:#06b6d4; --c3:#10b981; --c4:#f59e0b; --c5:#ec4899;
    --panel:rgba(18,21,38,.82); --border:rgba(120,130,200,.22);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(ellipse at 50% 30%,#0c1024 0%,#05060d 70%);
    color:var(--text);
    font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
    overflow:hidden;
  }
  #stars{position:fixed;inset:0;z-index:0}

  /* ─── top bar ─── */
  .topbar{
    position:fixed;top:0;left:0;right:0;z-index:50;
    display:flex;align-items:center;gap:12px;padding:16px 24px;
    pointer-events:none;
  }
  .crumb{
    display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);
    pointer-events:auto;
  }
  .crumb span{cursor:pointer;transition:color .2s}
  .crumb span:hover{color:var(--text)}
  .crumb .sep{cursor:default;opacity:.5}
  .crumb .cur{color:var(--text);font-weight:600;cursor:default}
  .back-btn{
    pointer-events:auto;display:none;align-items:center;gap:6px;
    background:rgba(255,255,255,.04);border:1px solid var(--border);
    color:var(--muted);border-radius:20px;padding:6px 16px;font-size:13px;cursor:pointer;
    backdrop-filter:blur(8px);transition:all .2s;
  }
  .back-btn:hover{color:var(--text);border-color:var(--c1)}
  .back-btn.show{display:inline-flex}

  /* ─── stage / scenes ─── */
  #stage{position:relative;z-index:10;width:100%;height:100vh}
  .scene{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;
    transition:opacity .6s ease, transform .6s ease;
    transform:scale(1.15);
  }
  .scene.active{opacity:1;pointer-events:auto;transform:scale(1)}
  .scene.exit-out{opacity:0;transform:scale(0.6)}

  .scene-title{
    position:absolute;top:11%;left:0;right:0;text-align:center;
    pointer-events:none;
  }
  .scene-title h1{
    font-size:clamp(22px,4vw,40px);font-weight:800;letter-spacing:2px;
    background:linear-gradient(135deg,#fff,#9aa6ff);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  }
  .scene-title p{color:var(--muted);font-size:14px;margin-top:8px;letter-spacing:1px}

  /* ─── orbit field (L0/L1 star nodes) ─── */
  .field{position:relative;width:min(820px,92vw);height:min(620px,72vh)}
  .node{
    position:absolute;transform:translate(-50%,-50%);
    display:flex;flex-direction:column;align-items:center;gap:10px;
    cursor:pointer;text-align:center;
    transition:transform .35s cubic-bezier(.2,.8,.3,1.2);
    animation:float 6s ease-in-out infinite;
  }
  @keyframes float{0%,100%{margin-top:0}50%{margin-top:-10px}}
  .node:hover{transform:translate(-50%,-50%) scale(1.12)}
  .orb{
    width:var(--sz,86px);height:var(--sz,86px);border-radius:50%;
    position:relative;
    background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.9),var(--cc) 45%,rgba(0,0,0,.4) 100%);
    box-shadow:0 0 24px var(--cc),0 0 60px color-mix(in srgb,var(--cc) 55%,transparent),inset -6px -8px 18px rgba(0,0,0,.45);
  }
  .orb::after{
    content:'';position:absolute;inset:-14px;border-radius:50%;
    border:1px solid color-mix(in srgb,var(--cc) 40%,transparent);
    opacity:.5;animation:ring 8s linear infinite;
  }
  @keyframes ring{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.08)}100%{transform:rotate(360deg) scale(1)}}
  .node .lbl{font-size:15px;font-weight:700;color:var(--text);text-shadow:0 2px 12px rgba(0,0,0,.8)}
  .node .sub{font-size:11px;color:var(--muted);letter-spacing:1px}
  .node .kicker{
    font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
    color:var(--cc);opacity:.85;
  }

  /* svg connector lines for constellation */
  .lines{position:absolute;inset:0;pointer-events:none;overflow:visible}
  .lines line{stroke:var(--cc,#6366f1);stroke-width:1;opacity:.18;stroke-dasharray:3 5}

  /* ─── L2 content panel ─── */
  .panel-scene{
    position:absolute;inset:0;z-index:20;
    display:none;flex-direction:column;
    background:linear-gradient(180deg,rgba(5,6,13,.4),rgba(5,6,13,.85));
    backdrop-filter:blur(2px);
  }
  .panel-scene.active{display:flex;animation:panelIn .5s ease}
  @keyframes panelIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
  .panel-inner{
    width:min(960px,94vw);margin:0 auto;flex:1;overflow-y:auto;
    padding:84px 8px 60px;
  }
  .panel-inner::-webkit-scrollbar{width:8px}
  .panel-inner::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

  .phead{margin-bottom:24px}
  .phead .ktag{
    display:inline-block;font-size:11px;font-weight:700;letter-spacing:1.5px;
    text-transform:uppercase;padding:4px 12px;border-radius:20px;margin-bottom:12px;
    background:color-mix(in srgb,var(--cc) 18%,transparent);color:var(--cc);
  }
  .phead h2{font-size:26px;font-weight:800;margin-bottom:8px}
  .phead p{color:var(--muted);font-size:14px;line-height:1.7;max-width:720px}

  .cat{
    background:var(--panel);border:1px solid var(--border);
    border-radius:14px;margin-bottom:12px;overflow:hidden;
    backdrop-filter:blur(10px);
  }
  .cat>summary{
    list-style:none;cursor:pointer;padding:16px 20px;
    display:flex;flex-direction:column;gap:8px;transition:background .2s;
  }
  .cat>summary::-webkit-details-marker{display:none}
  .cat>summary:hover{background:rgba(255,255,255,.03)}
  .cat-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .cat-head .nm{font-size:15px;font-weight:700;display:flex;align-items:center;gap:10px}
  .cat-head .nm .dot{width:8px;height:8px;border-radius:50%;background:var(--cc);box-shadow:0 0 8px var(--cc);flex-shrink:0}
  .cat-head .tg{font-size:11px;color:var(--muted);flex-shrink:0}
  .cat[open] .cat-head .tg::after{content:'收起 ▲'}
  .cat:not([open]) .cat-head .tg::after{content:'展开 ▼'}
  .concl{font-size:13px;line-height:1.7;color:var(--muted)}
  .concl strong{color:var(--text)}
  .cbody{padding:4px 20px 20px;border-top:1px solid var(--border);padding-top:14px;font-size:13px;line-height:1.75;color:var(--muted)}
  .cbody ul{padding-left:18px;margin:6px 0}
  .cbody li{margin-bottom:5px}
  .cbody strong{color:var(--text)}

  .tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:12px;margin-right:6px;letter-spacing:.5px}
  .t-verified{background:rgba(16,185,129,.16);color:var(--c3)}
  .t-crawl{background:rgba(245,158,11,.16);color:var(--c4)}
  .t-moat{background:rgba(99,102,241,.16);color:var(--c1)}
  .t-arms{background:rgba(139,147,176,.16);color:var(--muted)}

  .links{list-style:none;padding:0;margin:8px 0 0}
  .links li{margin-bottom:7px}
  .links a{
    display:inline-flex;align-items:center;gap:7px;color:var(--c2);text-decoration:none;
    font-size:13px;padding:6px 11px;border-radius:8px;background:rgba(255,255,255,.04);transition:.15s;
  }
  .links a:hover{background:rgba(255,255,255,.1);color:var(--text)}
  .vwrap{position:relative;width:100%;padding-bottom:56.25%;height:0;margin:12px 0;border-radius:10px;overflow:hidden;background:#000;border:1px solid var(--border)}
  .vwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .vph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;height:100%;color:var(--muted);font-size:13px;text-align:center;padding:0 16px;background:linear-gradient(135deg,rgba(30,34,60,.6),rgba(10,12,24,.6))}
  .vph a{color:var(--c2);text-decoration:none}
  .ctable{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
  .ctable th{background:rgba(255,255,255,.04);padding:9px 12px;text-align:left;color:var(--muted);font-weight:600;font-size:11px}
  .ctable td{padding:9px 12px;border-top:1px solid var(--border);vertical-align:top;line-height:1.6}
  .note{background:color-mix(in srgb,var(--cc) 8%,transparent);border:1px solid color-mix(in srgb,var(--cc) 25%,transparent);border-radius:10px;padding:13px 16px;font-size:13px;line-height:1.7;color:var(--muted);margin:16px 0}
  .note strong{color:var(--text)}
  .matrix{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
  .quad{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
  .quad h5{font-size:13px;margin-bottom:8px}
  .quad ul{padding-left:16px}.quad li{font-size:12px;color:var(--muted);line-height:1.8}

  .hint{position:fixed;bottom:22px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted);z-index:40;pointer-events:none;letter-spacing:1px;opacity:.7}
  @media(max-width:600px){.matrix{grid-template-columns:1fr}.field{height:64vh}}
</style>
</head>
<body>
<canvas id="stars"></canvas>

<div class="topbar">
  <button class="back-btn" id="backBtn">&#8592; 返回</button>
  <div class="crumb" id="crumb"><span class="cur">KR4 后编辑宇宙</span></div>
</div>

<div id="stage"></div>
<div class="panel-scene" id="panel"></div>
<div class="hint" id="hint">✦ 点击星球进入 · 滚轮浏览</div>

<script>
/* ════════════ DATA MODEL ════════════ */
const PARTS = [
  {
    id:'s1', cc:'#6366f1', kicker:'Part 01', title:'定义成功', sub:'顶层锚',
    desc:'在拆能力之前先把目标翻译成可衡量的东西，否则后面挖出的需求没法排序。',
    branches:[
      {name:'北极星指标', concl:'<strong>本质：让用户在画布里把图改到位，并愿意继续改。</strong>不直接背 DAU，核心是编辑深度与复用意愿，而非功能覆盖数量。'},
      {name:'指标分层（漏斗）', concl:'<strong>L1 渗透率 → L2 完成率 → L3 留存复用。</strong>每个能力必须挂到其中一层，否则不排序。',
        body:'<ul><li><strong>L1 渗透率</strong>：多少生成用户进入后编辑流程</li><li><strong>L2 完成率</strong>：单次编辑的成功/满意率</li><li><strong>L3 留存复用</strong>：编辑后下次继续用画布改图的比例</li></ul>'},
      {name:'一句话验收标准', concl:'KR4 结束时能说出：<strong>「用户现在能在画布里完成 X，而 Q2 完不成」</strong>。X 必须具体到场景和动作，不能是功能名词。'},
      {name:'常见陷阱', concl:'用功能数量代替用户价值；指标只到 L1 就停；验收写成「上线了某功能」；每个能力都说打 DAU 导致无法区分优先级。'},
    ]
  },
  {
    id:'s2', cc:'#06b6d4', kicker:'Part 02', title:'能力盘点与分线', sub:'A线 vs B线',
    desc:'关键原则：别让「发现」盖过「做深」。两条线工作方法完全不同，必须拆开管理。',
    branches:[
      {name:'A 线 · 做深核心能力', concl:'<span class="tag t-moat">模型协同主场</span><strong>图层分离 / 文字编辑 / 指令编辑。</strong>KR 点名要和 Seed 深度合作，问题不是做不做，而是怎么到产品可用水位。',
        body:'主战场在模型协同，不在需求发现。建议占总投入 <strong>60–70%</strong>。'},
      {name:'B 线 · 发现新能力', concl:'<span class="tag t-arms">需求发现主场</span><strong>调色 / 调角度 / 打光 / 多尺寸</strong>，及调研挖出的未包装需求。这才是调研引擎发力的地方，占 <strong>30–40%</strong>。'},
      {name:'精力分配警告', concl:'分线之后，精力才不会被「调色/打光」这类好做的增量带跑，而忽略真正撬动 KR 的三个核心。'},
      {name:'工作方法差异', concl:'A线产出「模型评测标准+验收水位」，对接 Seed；B线产出「用户需求报告+竞品分析」，对接用研+设计。',
        body:'<table class="ctable"><tr><th>维度</th><th>A 线</th><th>B 线</th></tr><tr><td>核心问题</td><td>怎么到可用水位</td><td>做不做、做哪个</td></tr><tr><td>主要输出</td><td>评测标准+水位</td><td>需求报告+竞品</td></tr><tr><td>协作方</td><td>Seed 团队</td><td>用研+设计</td></tr></table>'},
    ]
  },
  {
    id:'s3', cc:'#10b981', kicker:'Part 03', title:'五维分析框架', sub:'核心引擎',
    desc:'三个原有维度 + 补充两维。对 A/B 线每个能力都跑一遍。维度①已填充调研数据。',
    branches:[
      {name:'① 用户与场景　★调研工作台', cc:'#6366f1',
        concl:'<span class="tag t-verified">已填充</span><strong>看真实需求，抓「没被包装、用户在用 coding 自己实现」的能力。</strong>下含场景拆解·平台品牌·博主清单·痛点·海外平台。',
        cats:'scenarios'},
      {name:'② 竞品与差异化', concl:'不只看「竞品做了我没做」，分两类：<strong>护城河型</strong>（画布+Seed 才做得动，别人抄不了，如图层分离＋指令编辑组合）优先占 Seed 产能；<strong>军备竞赛型</strong>补齐缺口。'},
      {name:'③ 模型协同', concl:'<strong>不止「哪个模型好」，而是定义模型该优化什么。</strong>这是周三会的核心产出。',
        body:'每个能力明确：<ul><li>评测标准</li><li>关键失败 case</li><li>需要的数据</li><li>做到什么水位算产品可用</li></ul>'},
      {name:'④ 链路', concl:'<strong>用户是否顺手进得了后编辑？几个能力能否串起来连续改？</strong>「优化后编辑链路」的落点，不能用离散能力的加总代替。'},
      {name:'⑤ 价值 / 指标', concl:'<strong>这个能力打哪个指标、怎么量。</strong>对应 Part 01 的 L1/L2/L3。这一维填完，前四维挖出的需求才排得出序。'},
    ]
  },
  {
    id:'s4', cc:'#f59e0b', kicker:'Part 04', title:'优先级与降级', sub:'价值×可行',
    desc:'用「产品价值 × 模型可行性（Seed 当前水位）」做二维矩阵，每个强依赖能力先想好降级版本。',
    branches:[
      {name:'排序标准', concl:'<strong>X 轴产品价值（对 L1/L2/L3 撬动）× Y 轴模型可行性（Seed 水位）。</strong>两维相乘出优先级，而非拍脑袋。'},
      {name:'四象限矩阵', concl:'高价值高可行→主链路；高价值低可行→Seed 需求清单（周三会核心）；低价值放后。',
        body:'<div class="matrix"><div class="quad"><h5 style="color:var(--c3)">🟢 高价值×高可行 → 主链路</h5><ul><li>文字编辑（预判）</li><li>图层分离（预判）</li></ul></div><div class="quad"><h5 style="color:var(--c4)">🟡 高价值×低可行 → Seed 清单</h5><ul><li>指令编辑（预判）</li><li>打光控制（预判）</li></ul></div><div class="quad"><h5 style="color:var(--c2)">🔵 低价值×高可行 → 后续迭代</h5><ul><li>调色（待评估）</li></ul></div><div class="quad"><h5 style="color:var(--muted)">⚫ 低价值×低可行 → 先放</h5><ul><li>持续观察竞品</li></ul></div></div>'},
      {name:'降级策略', concl:'<strong>每个强依赖 Seed 的能力，先想清楚「模型没到预期时，产品侧的可降级版本是什么」。</strong>「不负向即合格」决定它敢不敢放主链路，还是只能做灰度。'},
    ]
  },
  {
    id:'s5', cc:'#ec4899', kicker:'Part 05', title:'交付物', sub:'周三会材料',
    desc:'框架跑完产出两份。第二份才是真正立住「model-product co-design 判断力」的实物证据。',
    branches:[
      {name:'交付物 A · 产品路线图', concl:'<span class="tag t-moat">对内</span>按指标价值排序的 KR4 能力列表，标清 A/B 线、链路串法、各能力打的指标、排期、降级备案。'},
      {name:'交付物 B · Seed 需求清单', concl:'<span class="tag t-arms">对 Seed</span><strong>周三会核心材料。</strong>按产品价值排序，每项写明评测标准、关键失败 case、所需数据、目标水位。',
        body:'<div class="note"><strong>关键区别：</strong>拿出交付物 B 而非一张功能清单，分量完全不同——前者在<strong>定义「模型该为什么优化」</strong>，后者只是在许愿。</div>'},
      {name:'周三会议程', concl:'北极星对齐(5min) → A线水位 review(20min) → 高价值低可行 Seed 卡(20min) → B线快评(10min) → 确认 milestone(5min)。'},
    ]
  },
];

/* 维度①的深层类目（场景调研工作台） */
const SCENARIOS = {
  title:'用户与场景 · 调研工作台', cc:'#6366f1',
  desc:'每个条目结论先行：默认只看一句话判断，点开看链接，部分支持视频内嵌。标签：已验证 / 待爬取 / 护城河 / 军备竞赛。',
  cats:[
    {name:'① 后编辑能力 · 场景拆解',

      body:'<table class="ctable"><tr><th>场景大类</th><th>典型需求</th><th>吃哪些能力</th></tr>'+
        '<tr><td><strong>电商商品图</strong></td><td>换背景、抠主体、改促销文案、出多尺寸</td><td>图层分离·文字编辑·多尺寸·打光</td></tr>'+
        '<tr><td><strong>海报/营销物料</strong></td><td>调整标题排版、改配色统一品牌、局部替换</td><td>文字编辑·调色·指令编辑</td></tr>'+

        '<tr><td><strong>社媒内容</strong></td><td>适配 IG/小红书/X 不同比例、换文案</td><td>多尺寸·文字编辑</td></tr>'+

        '<tr><td><strong>影视/游戏概念图</strong></td><td>局部精修、光影氛围调整</td><td>指令编辑·打光·图层分离</td></tr></table>'},
    {name:'② 平台与品牌能力盘点',
      concl:'<strong>Lovart 是正面竞品（链路最完整），Adobe Firefly 是图层分离的对标基准。</strong>模型层 Nano Banana 一致性最强、Seedream 走高端写实。',

/* ════════════ STARFIELD ════════════ */
const cv=document.getElementById('stars'),ctx=cv.getContext('2d');
let W,H,stars=[],warp=0;
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight}
resize();addEventListener('resize',resize);
for(let i=0;i<260;i++)stars.push({x:Math.random(),y:Math.random(),z:Math.random()*.8+.2,t:Math.random()*6.28});
function draw(){
  ctx.clearRect(0,0,W,H);
  for(const s of stars){
    s.t+=0.02;
    const tw=.5+.5*Math.sin(s.t);
    let px=s.x*W,py=s.y*H;
    if(warp>0){const dx=px-W/2,dy=py-H/2;px+=dx*warp*s.z*0.6;py+=dy*warp*s.z*0.6;}
    const r=s.z*1.6*(warp>0?(1+warp*2):1);
    ctx.beginPath();ctx.arc(px,py,r,0,6.28);
    ctx.fillStyle=`rgba(${200+s.z*55|0},${210+s.z*45|0},255,${(.25+.6*tw)*s.z})`;
    ctx.fill();
    if(warp>0){ctx.strokeStyle=`rgba(180,200,255,${.15*warp})`;ctx.lineWidth=r;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(W/2+(px-W/2)*.8,H/2+(py-H/2)*.8);ctx.stroke();}
  }
  if(warp>0)warp*=0.9,warp<0.01&&(warp=0);
  requestAnimationFrame(draw);
}
draw();
function doWarp(){warp=1;}

/* ════════════ NAV / RENDER ════════════ */
const stage=document.getElementById('stage'),panel=document.getElementById('panel');
const backBtn=document.getElementById('backBtn'),crumb=document.getElementById('crumb'),hint=document.getElementById('hint');
let level=0,curPart=null;

// positions for nodes scattered like constellation
function scatter(n){
  // returns n {x%,y%} spread, avoiding center title area
  const pts=[];const cx=50,cy=56;
  for(let i=0;i<n;i++){
    const ang=(i/n)*6.28 - 1.57 + (n>4?0:0.3);
    const rad=n<=3?30:34+(i%2)*6;
    pts.push({x:cx+Math.cos(ang)*rad*(W>700?1:.8), y:cy+Math.sin(ang)*rad*0.86});
  }
  return pts;
}

function renderUniverse(){
  level=0;curPart=null;
  hint.textContent='✦ 点击星球进入对应模块';
  backBtn.classList.remove('show');
  crumb.innerHTML='<span class="cur">KR4 后编辑宇宙</span>';
  const pts=scatter(PARTS.length);
  let html='<div class="scene active" id="sceneU"><div class="scene-title"><h1>KR4 · 后编辑宇宙</h1><p>五大模块 · 点击星球展开星空</p></div><div class="field" id="fieldU">';
  html+=svgLines(pts,'#6366f1');
  PARTS.forEach((p,i)=>{
    html+=`<div class="node" style="left:${pts[i].x}%;top:${pts[i].y}%;--cc:${p.cc};animation-delay:${i*.4}s" onclick="openPart('${p.id}')">
      <div class="orb" style="--sz:${78+ (p.id==='s3'?16:0)}px"></div>
      <div class="kicker">${p.kicker}</div>
      <div class="lbl">${p.title}</div><div class="sub">${p.sub}</div></div>`;
  });
  html+='</div></div>';
  stage.innerHTML=html;
  panel.classList.remove('active');
}

function svgLines(pts,cc){
  // connect sequential + to center
  let s=`<svg class="lines" style="--cc:${cc}">`;
  for(let i=0;i<pts.length;i++){
    const a=pts[i],b=pts[(i+1)%pts.length];
    s+=`<line x1="${a.x}%" y1="${a.y}%" x2="${b.x}%" y2="${b.y}%"></line>`;
    s+=`<line x1="50%" y1="56%" x2="${a.x}%" y2="${a.y}%"></line>`;
  }
  return s+'</svg>';
}

function openPart(id){
  doWarp();
  const p=PARTS.find(x=>x.id===id);curPart=p;level=1;
  setTimeout(()=>{
    hint.textContent='✦ 点击分支星星查看类目';
    backBtn.classList.add('show');
    crumb.innerHTML=`<span onclick="renderUniverse()">宇宙</span><span class="sep">›</span><span class="cur">${p.title}</span>`;
    const pts=scatter(p.branches.length);
    let html=`<div class="scene active"><div class="scene-title"><h1 style="background:linear-gradient(135deg,#fff,${p.cc});-webkit-background-clip:text">${p.title}</h1><p>${p.desc}</p></div><div class="field">`;
    html+=svgLines(pts,p.cc);
    p.branches.forEach((b,i)=>{
      const cc=b.cc||p.cc;
      html+=`<div class="node" style="left:${pts[i].x}%;top:${pts[i].y}%;--cc:${cc};animation-delay:${i*.3}s" onclick="openBranch('${id}',${i})">
        <div class="orb" style="--sz:58px"></div>
        <div class="lbl" style="font-size:13px;max-width:150px">${b.name}</div></div>`;
    });
    html+='</div></div>';
    stage.innerHTML=html;
    panel.classList.remove('active');
  },260);
}

function openBranch(id,idx){
  const p=PARTS.find(x=>x.id===id);const b=p.branches[idx];
  // special deep page: scenarios workbench
  if(b.cats==='scenarios'){renderPanel(SCENARIOS,()=>openPart(id),p.title);return;}
  level=2;
  backBtn.classList.add('show');
  crumb.innerHTML=`<span onclick="renderUniverse()">宇宙</span><span class="sep">›</span><span onclick="openPart('${id}')">${p.title}</span><span class="sep">›</span><span class="cur">${b.name}</span>`;
  hint.textContent='';
  const cc=b.cc||p.cc;
  let html=`<div class="panel-inner" style="--cc:${cc}"><div class="phead"><div class="ktag">${p.kicker} · 分支</div><h2>${b.name}</h2></div>`;
  html+=`<div class="cat" open><summary><div class="cat-head"><div class="nm"><span class="dot"></span>结论</div></div><div class="concl">${b.concl}</div></summary>`;
  if(b.body)html+=`<div class="cbody">${b.body}</div>`;
  html+='</div></div>';
  panel.innerHTML=html;panel.style.setProperty('--cc',cc);
  panel.classList.add('active');
  backBtn.onclick=()=>{panel.classList.remove('active');openPart(id);};
}

function renderPanel(data,backFn,parentTitle){
  level=2;backBtn.classList.add('show');hint.textContent='';
  crumb.innerHTML=`<span onclick="renderUniverse()">宇宙</span><span class="sep">›</span><span onclick="openPart('s3')">五维分析框架</span><span class="sep">›</span><span class="cur">${data.title}</span>`;
  let html=`<div class="panel-inner" style="--cc:${data.cc}"><div class="phead"><div class="ktag">Part 03 · 维度① 深层</div><h2>${data.title}</h2><p>${data.desc}</p></div>`;
  data.cats.forEach((c,i)=>{
    html+=`<details class="cat" ${i===0?'open':''}><summary><div class="cat-head"><div class="nm"><span class="dot"></span>${c.name}</div><span class="tg"></span></div><div class="concl">${c.concl}</div></summary>`;
    if(c.body)html+=`<div class="cbody">${c.body}</div>`;
    html+='</details>';
  });
  html+='</div>';
  panel.innerHTML=html;panel.style.setProperty('--cc',data.cc);
  panel.classList.add('active');
  backBtn.onclick=backFn;
}

backBtn.onclick=()=>{ if(level===2){panel.classList.remove('active');curPart?openPart(curPart.id):renderUniverse();} else renderUniverse(); };

renderUniverse();
</script>
